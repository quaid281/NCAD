[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ncad-cs"
version = "5.0.0"
description = "Neural Contextual Anomaly Detection with Counterfactual Successor Memory, Spatial-Temporal Relational GAT, and EVT/SPOT Tail Calibration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NCAD-CS Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "PyWavelets>=1.4.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module-level imports not at top (intentional in scripts with sys.path manipulation)
    "W293",  # whitespace in blank lines (cosmetic)
    "F401",  # unused imports in __init__.py re-exports are intentional
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401"]
"scripts/run_modern_baselines.py" = ["F821"]  # model is assigned in if/elif branches; ruff cannot trace closure captures
